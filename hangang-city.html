let seed=20261118; const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

 m.position.set(x,h/2,z); buildings.add(m); solid(m,x-w/2,x+w/2,z-d/2,z+d/2);

 building(gx,gz,bw2,bh2,bd2,new THREE.Color().setHSL(.08+rnd()*.08,.3,.4+rnd()*.2),i%6==0?{txt:'편의점 24',c:'#7CFC00'}:null);}

const mart=new THREE.Mesh(new THREE.BoxGeometry(16,6,12),new THREE.MeshLambertMaterial({color:0xe8e8e8}));
mart.position.set(45,3,-45); scene.add(mart); solid(mart,37,53,-51,-39);
const martSign=new THREE.Mesh(new THREE.PlaneGeometry(14,4),new THREE.MeshBasicMaterial({map:textTex('편의점 한강', '#7CFC00')}));
martSign.position.set(45,7.5,-38.8); scene.add(martSign); neonSigns.push(martSign);
// 창문 인스턴싱
const winInst=new THREE.InstancedMesh(winGeo,winMat,winPos.length);
{const d=new THREE.Object3D();winPos.forEach((p,i)=>{d.position.set(p[0],p[1],p[2]);d.updateMatrix();winInst.setMatrixAt(i,d.matrix);});}
scene.add(winInst);
// 가로등 인스턴싱(기둥) + 전구(발광구, 밤에만 보임)
const lampGeo=new THREE.CylinderGeometry(.25,.25,9,6); const lampMat=new THREE.MeshLambertMaterial({color:0x333a44});
const lampPos=[]; for(let x=-180;x<=180;x+=60)for(let z=-180;z<=180;z+=60){if(Math.abs(x)<24)continue;lampPos.push([x+8,z+8]);}
const lampInst=new THREE.InstancedMesh(lampGeo,lampMat,lampPos.length);
const bulbGeo=new THREE.SphereGeometry(.7,8,8); const bulbMat=new THREE.MeshBasicMaterial({color:0xffe9a3});
const bulbInst=new THREE.InstancedMesh(bulbGeo,bulbMat,lampPos.length);
{const d=new THREE.Object3D();lampPos.forEach((p,i)=>{d.position.set(p[0],4.5,p[1]);d.updateMatrix();lampInst.setMatrixAt(i,d.matrix);
 d.position.set(p[0],9.2,p[1]);d.updateMatrix();bulbInst.setMatrixAt(i,d.matrix);});}
scene.add(lampInst,bulbInst); bulbInst.visible=false;
// --- 캐릭터/차량 (전부 Box) ---
function boxCar(color){const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.BoxGeometry(4.4,1.2,2.2),new THREE.MeshLambertMaterial({color}));b.position.y=1;g.add(b);
 const t=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,2),new THREE.MeshLambertMaterial({color:0x222831}));t.position.set(-.2,1.9,0);g.add(t);
 const wG=new THREE.CylinderGeometry(.45,.45,.4,10);const wM=new THREE.MeshLambertMaterial({color:0x111111});g.userData.wheels=[];
 [[1.5,.1,1.1],[1.5,.1,-1.1],[-1.5,.1,1.1],[-1.5,.1,-1.1]].forEach(p=>{const w=new THREE.Mesh(wG,wM);w.rotation.x=Math.PI/2;w.position.set(p[0],.45,p[2]);g.add(w);g.userData.wheels.push(w);});
 scene.add(g);return g;}
const playerMesh=new THREE.Group();
const pBody=new THREE.Mesh(new THREE.BoxGeometry(.9,1.7,.5),new THREE.MeshLambertMaterial({color:0xffcc66}));pBody.position.y=1.1;playerMesh.add(pBody);
const pHead=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.55),new THREE.MeshLambertMaterial({color:0xf2c9a0}));pHead.position.y=2.25;playerMesh.add(pHead);
playerMesh.position.set(60,0,60); scene.add(playerMesh);
const myCar=boxCar(0x38bdf8); myCar.position.set(60,0,52); myCar.visible=true;
const parked=[myCar]; const parkSpots=[[60,52],[-40,20],[-40,-80],[70,40],[70,-100]];
for(let i=1;i<5;i++){const c=boxCar([0xf87171,0xa3e635,0xfbbf24,0xc084fc][i-1]);c.position.set(parkSpots[i][0],0,parkSpots[i][1]);c.rotation.y=(rnd()*4|0)*Math.PI/2;parked.push(c);}
// AI 차량(신호 준수) — 사각 루프
const aiCars=[]; const loop=[[-120,-120],[120,-120],[120,120],[-120,120]];
for(let i=0;i<6;i++){const c=boxCar(0xe5e7eb);const wp=i%4;c.userData={wp,stop:0,speed:8+rnd()*3};c.position.set(loop[wp][0]+(rnd()*20-10),0,loop[wp][1]);aiCars.push(c);}
// 순찰차 2대
const patrols=[boxCar(0x1d4ed8),boxCar(0x1d4ed8)]; patrols.forEach((p,i)=>{p.position.set(-60+i*120,0,100);p.userData={speed:0};});
// 보행자 왕복
const peds=[]; for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.7,1.7,.5),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(rnd(),.6,.55)}));
 const ax=rnd()>.5, fx=-150+rnd()*300, fz=-150+rnd()*300; m.position.set(fx,1,ax?fz+8:fz); scene.add(m);
 peds.push({m,ax,fx,fz,t:rnd()*10,dir:1});}
// 미션 마커 3개
function marker(x,z,c){const m=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.5,.4,16),new THREE.MeshBasicMaterial({color:c}));m.position.set(x,.3,z);scene.add(m);return m;}
const mk={delivery:marker(45,-60,0x22ff88),chase:marker(-40,40,0xff4444),race:marker(0,120,0xffd23f)};
// 체크포인트(레이스)
const cps=[]; [[0,100],[60,100],[60,40],[0,40],[0,100]].forEach(([x,z],i)=>{const r=new THREE.Mesh(new THREE.TorusGeometry(3,.4,8,20),new THREE.MeshBasicMaterial({color:0xffd23f}));r.rotation.x=Math.PI/2;r.position.set(x,2,z);r.visible=false;scene.add(r);cps.push(r);});
// --- 입력 ---
const key={}; addEventListener('keydown',e=>{key[e.code]=true;if(e.code==='KeyF')tryEnter();if(e.code==='KeyE')startMission();if(e.code==='KeyR')reset();});
addEventListener('keyup',e=>key[e.code]=false);
let yaw=-Math.PI/4,pitch=.32,drag=false,lx=0,ly=0;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.005;pitch=Math.min(1.2,Math.max(.05,pitch+(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY;});
// --- 상태 ---
const P={pos:playerMesh.position,vy:0,onCar:null,heading:0,speed:0,wanted:0,hideT:0};
let mission=null,mtimer=0,evade=0,cpIdx=0;
const msgEl=document.getElementById('msg');let msgT=0;
function msg(t){msgEl.textContent=t;msgEl.style.display='block';msgT=3;}
function collide(x,z){for(const c of colliders)if(x>c.x0-.5&&x<c.x1+.5&&z>c.z0-.5&&z<c.z1+.5)return true;return false;}
function inRiver(x,z){return Math.abs(x)<17&&Math.abs(z-0)>8?false:Math.abs(x)<17;} // 다리 위(y>1)면 무시
function tryEnter(){ if(P.onCar){P.onCar=null;playerMesh.visible=true;playerMesh.position.copy(myCar.position).add(new THREE.Vector3(3,0,0));msg('하차');return;}
 let best=null,bd=9; for(const c of parked){const d=c.position.distanceTo(playerMesh.position);if(d<bd){bd=d;best=c;}}
 if(best){P.onCar=best;playerMesh.visible=false;msg('탑승! WASD 운전, Space 드리프트');} else msg('차량 근처에서 F');}
function nearestMk(){let b=null,bd=1e9,nm='';for(const k in mk){const d=mk[k].position.distanceTo(P.onCar?P.onCar.position:playerMesh.position);if(d<bd){bd=d;nm=k;}}return bd<25?nm:null;}
function startMission(){const n=nearestMk();if(!n){msg('마커(초록/빨강/노랑 원) 근처에서 E');return;}
 if(n==='delivery'){mission='delivery';mtimer=60;mk.delivery.material.color.set(0xffffff);msg('배달: 60초 안에 노랑 체크포인트(0,120)로!');cps.forEach(c=>c.visible=false);cps[4].visible=true;}
 if(n==='chase'){mission='chase';mtimer=30;evade=0;P.wanted=2;msg('추격: 30초간 순찰차를 따돌려라!');}
 if(n==='race'){mission='race';cpIdx=0;cps.forEach((c,i)=>c.visible=i===0);msg('레이스: 옥상...아니 지상 체크포인트 순서대로 통과!');}}
function reset(){playerMesh.position.set(60,0,60);P.vy=0;P.speed=0;myCar.position.set(60,0,52);P.wanted=0;mission=null;cps.forEach(c=>c.visible=false);camSnap=true;msg('리셋');}
function bumpWanted(){if(P.wanted<3){P.wanted++;msg('수배 레벨 '+P.wanted+'! 순찰차가 추적한다. 멀리 숨으면 내려감');}}
// 신호등 타이머(전역)
let sigT=0;
// --- 미니맵/속도계 ---
const mm=document.getElementById('minimap').getContext('2d');
// --- 메인 루프 ---
const clock=new THREE.Clock(); let dayT=60, frames=0,fpsT=0;
const camTarget=new THREE.Vector3(); const ray=new THREE.Raycaster(); let camSnap=true;
function step(){
 requestAnimationFrame(step);
 const dt=Math.min(clock.getDelta(),.05); const t=clock.elapsedTime;
 // 낮→노을→밤 180초
 dayT=(dayT+dt)%180; const ph=dayT/180; // 0낮 .5노을 .75밤

 scene.background.copy(sky);scene.fog.color.copy(sky);sun.intensity=sunI;
 const night=ph>=.55&&ph<.85; bulbInst.visible=night; winMat.color.set(night?0xffe27a:0x9db3c8);
 neonSigns.forEach(s=>{s.visible=true; const d=s.position.distanceTo(camera.position); if(d>280)s.visible=false;});
 sigT+=dt; const green=(sigT%12)<7; // 신호
 // --- 플레이어/차량 ---
 const focus=P.onCar?P.onCar.position:playerMesh.position;
 if(P.onCar){ // 차량 물리
  const c=P.onCar; let acc=0;
  if(key.KeyW)acc+=14; if(key.KeyS)acc-=18;
  const drift=key.Space?true:false;
  P.speed+=(acc*dt)-P.speed*(drift?0.4:1.1)*dt; P.speed=Math.max(-12,Math.min(32,P.speed));
  let str=0; if(key.KeyA)str+=1; if(key.KeyD)str-=1;
  const grip=drift?2.6:1.4;
  c.rotation.y+=str*grip*dt*Math.min(1,Math.abs(P.speed)/8)*(P.speed>=0?1:-1);
  const nx=c.position.x+Math.cos(-c.rotation.y)*P.speed*dt*-1, nz=c.position.z+Math.sin(-c.rotation.y)*P.speed*dt*-1;
  // 간단 충돌 반동 + 수배
  if(!collide(nx,nz)){c.position.x=nx;c.position.z=nz;}
  else{P.speed*=-.35;if(Math.abs(P.speed)>4)bumpWanted();}
  if(Math.abs(c.position.x)<18&&Math.abs(c.position.z)<200&&!(Math.abs(c.position.z%60)<9))c.position.y=Math.max(0,c.position.y); // 강 추락 방지
  if(Math.abs(c.position.x)<18)c.position.x=18*Math.sign(c.position.x||1);
  c.position.x=Math.max(-260,Math.min(260,c.position.x));c.position.z=Math.max(-260,Math.min(260,c.position.z));

 } else { // 도보
  const sp=(key.ShiftLeft||key.ShiftRight)?10:5;
  let mx=0,mz=0; if(key.KeyW)mz+=1;if(key.KeyS)mz-=1;if(key.KeyA)mx-=1;if(key.KeyD)mx+=1;
  const len=Math.hypot(mx,mz)||1; const ang=yaw+Math.atan2(mx,mz);
  if(mx||mz){const nx=P.pos.x+Math.sin(ang)*sp*dt, nz=P.pos.z+Math.cos(ang)*sp*dt;
   if(!collide(nx,P.pos.z))P.pos.x=nx; if(!collide(P.pos.x,nz))P.pos.z=nz;
   playerMesh.rotation.y=ang; pBody.position.y=1.1+Math.abs(Math.sin(t*10))*.08;}
  P.vy-=22*dt; P.pos.y+=P.vy*dt; if(P.pos.y<=0){P.pos.y=0;P.vy=0;if(key.Space)P.vy=8;}
  P.pos.x=Math.max(-260,Math.min(260,P.pos.x));P.pos.z=Math.max(-260,Math.min(260,P.pos.z));
  document.getElementById('speed').textContent=(mx||mz?(key.ShiftLeft||key.ShiftRight?'달리기':'걷기'):'대기중');
 }
 // --- AI 차량: 루프 이동 + 신호대기 ---
 aiCars.forEach((c,i)=>{
  const tgt=loop[(c.userData.wp+1)%4]; const dx=tgt[0]-c.position.x,dz=tgt[1]-c.position.z;
  const dist=Math.hypot(dx,dz); if(dist<6)c.userData.wp=(c.userData.wp+1)%4;
  // 교차로 근처 + 적신호 → 정지
  const nearX=Math.abs(c.position.x%60)<8, nearZ=Math.abs(c.position.z%60)<8;
  if(!green&&nearX&&nearZ){c.userData.stop=1;}
  else if(green)c.userData.stop=0;
  if(!c.userData.stop){const a=Math.atan2(dx,dz);c.rotation.y=a;
   c.position.x+=Math.sin(a)*c.userData.speed*dt;c.position.z+=Math.cos(a)*c.userData.speed*dt;}
  // 플레이어 차량과 충돌 → 반동 + 수배 (폭력 묘사 없음, 파손 없음)
  const pf=P.onCar?P.onCar.position:null;
  if(pf&&c.position.distanceTo(pf)<4){P.speed*=.5;bumpWanted();c.position.x+= (c.position.x-pf.x)*dt*3;c.position.z+=(c.position.z-pf.z)*dt*3;}
 });
 // --- 보행자 왕복 ---
 peds.forEach(p=>{p.t+=dt*p.dir; if(p.t>14||p.t<0)p.dir*=-1;
  if(p.ax)p.m.position.x=p.fx-14+p.t*2; else p.m.position.z=p.fz-14+p.t*2;
  if(camera.position.distanceToSquared(p.m.position)>250*250)p.m.visible=false;else p.m.visible=true;});
 // --- 순찰차 추적 + 수배 ---
 let nearestPat=1e9;
 patrols.forEach(p=>{const d=p.position.distanceTo(focus);nearestPat=Math.min(nearestPat,d);
  if(P.wanted>0){const dx=focus.x-p.position.x,dz=focus.z-p.position.z;const a=Math.atan2(dx,dz);p.rotation.y=a;
   const sp=10+P.wanted*4; p.position.x+=Math.sin(a)*sp*dt;p.position.z+=Math.cos(a)*sp*dt;
   if(!P.onCar&&d<4){/* 도보 검문: 잡혀도 리셋만, 폭력 없음 */P.wanted=Math.max(1,P.wanted);}}
  else{p.position.x+=Math.sin(t*.3)*dt*2;}});
 if(P.wanted>0){ if(nearestPat>90){P.hideT+=dt;if(P.hideT>5){P.wanted--;P.hideT=0;msg('수배 하락 → '+P.wanted);}} else P.hideT=0; }
 // --- 미션 ---
 const mEl=document.getElementById('mission');
 if(mission==='delivery'){mtimer-=dt; const goal=cps[4].position;
  const d=goal.distanceTo(focus);
  mEl.textContent=`배달 ${mtimer.toFixed(0)}초 | 목적지까지 ${d.toFixed(0)}m (노랑 링)`;
  if(d<6){mission=null;cps[4].visible=false;mk.delivery.material.color.set(0x22ff88);mEl.textContent='배달 성공!';msg('배달 성공!');}
  if(mtimer<=0){mission=null;cps[4].visible=false;mEl.textContent='배달 실패… 마커에서 E로 재시작';}}
 else if(mission==='chase'){mtimer-=dt; if(nearestPat>60)evade+=dt;
  mEl.textContent=`추격 회피 ${mtimer.toFixed(0)}초 | 회피게이지 ${((evade/15*100)|0)}% (순찰차와 거리 ${nearestPat.toFixed(0)}m)`;
  if(evade>=15){mission=null;P.wanted=0;mEl.textContent='따돌리기 성공!';msg('추격 따돌리기 성공!');}
  if(mtimer<=0){mission=null;mEl.textContent='추격 실패… 마커에서 E로 재시작';}}
 else if(mission==='race'){const cp=cps[cpIdx];
  mEl.textContent=`레이스 체크포인트 ${cpIdx+1}/5 (다음 링까지 ${cp.position.distanceTo(focus).toFixed(0)}m)`;
  if(cp.position.distanceTo(focus)<6){cp.visible=false;cpIdx++;if(cpIdx>=5){mission=null;mEl.textContent='레이스 완주!';msg('레이스 완주!');}else cps[cpIdx].visible=true;}}
 else mEl.innerHTML='근처 마커에서 <b class="k">E</b> 미션 시작 (1배달 2추격 3레이스 중 가까운 것)';
 // --- 카메라: 3인칭 추적 + 충돌 회피(간단) ---
 const back=P.onCar?10.5:6.5, h=P.onCar?3.6:3.8;
 camTarget.set(focus.x-Math.sin(yaw)*Math.cos(pitch)*back,focus.y+h+Math.sin(pitch)*back,focus.z-Math.cos(yaw)*Math.cos(pitch)*back);
 if(camTarget.y<1.2)camTarget.y=1.2;
 for(let i=0;i<3&&collide(camTarget.x,camTarget.z);i++){camTarget.x=(camTarget.x+focus.x)/2;camTarget.z=(camTarget.z+focus.z)/2;camTarget.y+=1.5;}
 if(camSnap){camera.position.copy(camTarget);camSnap=false;}else camera.position.lerp(camTarget,.25);
 camera.lookAt(focus.x,focus.y+2,focus.z);
 // --- HUD ---
 document.getElementById('wanted').textContent='수배 '+'★'.repeat(P.wanted)+'☆'.repeat(3-P.wanted)+(green?' 🟢':' 🔴');
 document.getElementById('stat').textContent=(P.onCar?'차량':'도보')+' | '+(night?'밤(가로등·네온 ON)':ph<.55&&ph>=.4?'노을':'낮')+(mission?' | 미션:'+mission:'');
 if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.style.display='none';}
 // --- 미니맵 ---
 mm.fillStyle='#0a0f1c';mm.fillRect(0,0,170,170);
 mm.fillStyle='#1d4ed8';mm.fillRect(80,0,10,170); // 강
 mm.fillStyle='#333';const px=x=>(x+260)/520*170, pz=z=>(z+260)/520*170;
 mm.fillStyle='#7CFC00';mm.fillRect(px(45)-3,pz(-60)-3,6,6);
 mm.fillStyle='#f44';mm.fillRect(px(-40)-3,pz(40)-3,6,6);
 mm.fillStyle='#fd0';mm.fillRect(px(0)-3,pz(120)-3,6,6);
 mm.fillStyle='#fff';mm.fillRect(px(focus.x)-2.5,pz(focus.z)-2.5,5,5);
 mm.fillStyle='#8fb8ff';aiCars.forEach(c=>mm.fillRect(px(c.position.x)-1.5,pz(c.position.z)-1.5,3,3));
 mm.fillStyle='#4d7cff';patrols.forEach(c=>{mm.beginPath();mm.arc(px(c.position.x),pz(c.position.z),3,0,7);mm.fill();});
 frames++;fpsT+=dt;if(fpsT>=.5){document.getElementById('fps').textContent=Math.round(frames/fpsT)+' fps';frames=0;fpsT=0;}
 renderer.render(scene,camera);
}
step();
</script>
